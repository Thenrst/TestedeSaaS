<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaaS de Anotações</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1>SaaS de Anotações</h1>
      <p>Salve e organize suas anotações de forma simples e rápida.</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Nova anotação</h2>
      <form id="note-form">
        <label for="title">Título</label>
        <input type="text" id="title" name="title" placeholder="Digite um título" required />

        <label for="content">Conteúdo</label>
        <textarea id="content" name="content" rows="5" placeholder="Escreva sua anotação" required></textarea>

        <button type="submit">Salvar anotação</button>
      </form>
    </section>

    <section class="card">
      <h2>Minhas anotações</h2>
      <div id="notes-list" class="notes-list">
        <p class="empty">Nenhuma anotação ainda. Adicione uma acima.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>Projeto simples de SaaS de anotações.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
